<style>
:root{
  --bg:#eef2f1; --panel:#ffffff; --line:#e3e9e7; --line2:#d4ddd9;
  --ink:#1d2b28; --ink2:#5c6b66; --ink3:#93a29d;
  --brand:#0f766e; --brand-d:#0b4f4a; --brand-l:#e3f2f0;
  --amber:#d97706; --amber-d:#b45309; --amber-l:#fdf0dc;
  --danger:#dc2626; --danger-l:#fdeaea;
  --ok:#15803d; --ok-l:#e6f6ea;
  --boy:#dbeafe; --boy-b:#3b82f6; --boy-t:#1d4ed8;
  --girl:#fce7f3; --girl-b:#ec4899; --girl-t:#be185d;
  --shadow:0 1px 3px rgba(20,40,35,.08),0 8px 24px rgba(20,40,35,.06);
  --r:12px; --r-sm:8px;
  --font:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 8px;outline:none;transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
textarea{resize:vertical}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c8d2cf;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
.app{display:flex;flex-direction:column;min-height:100vh}

/* ===== 登录页 ===== */
.login-mask{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0f766e 0%,#134e4a 50%,#0b3b36 100%);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:rgba(255,255,255,.97);border-radius:22px;padding:44px 46px;width:100%;max-width:420px;box-shadow:0 30px 80px rgba(0,0,0,.4);text-align:center}
.login-card .l-ic{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,#2dd4bf,#0f766e);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px;color:#fff;box-shadow:0 10px 30px rgba(15,118,110,.4)}
.login-card h2{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:4px}
.login-card .l-sub{font-size:12.5px;color:var(--ink3);margin-bottom:26px}
.login-card input#login-pass{width:100%;text-align:center;font-size:26px;letter-spacing:12px;font-weight:700;padding:14px 10px;border:2px solid var(--line2);border-radius:12px;margin-bottom:14px}
.login-card input#login-pass:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(15,118,110,.15)}
.login-card .btn-login{width:100%;padding:14px;font-size:16px;font-weight:800;border-radius:12px;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;transition:all .2s}
.login-card .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(15,118,110,.35)}
.login-card .l-err{color:var(--danger);font-size:13px;min-height:20px;margin-top:10px;font-weight:600}
.login-card .l-foot{margin-top:22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);flex-wrap:wrap;gap:6px}
.login-card .l-foot button{font-size:12px;color:var(--brand);font-weight:700}
.login-card .l-foot button:hover{text-decoration:underline}
.lh-row{display:flex;align-items:center;gap:8px;margin:8px 0}
.lh-t{white-space:nowrap;color:var(--ink2);font-size:12.5px}
.lh-url{flex:1;font-family:ui-monospace,Consolas,monospace;color:var(--brand-d);word-break:break-all;font-size:12.5px;line-height:1.5;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.lh-copy{background:var(--brand);border:none;color:#fff;border-radius:6px;padding:5px 14px;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:700}
.lh-copy:hover{background:var(--brand-d)}
.lh-tip{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.6}
.passbook-rows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0 6px;max-height:320px;overflow-y:auto}
.passbook-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
.passbook-row b{font-size:16px;letter-spacing:2px;font-family:ui-monospace,Consolas,monospace;color:var(--brand-d)}
.passbook-row span{font-size:11px;color:var(--ink3)}

/* ===== 顶栏 ===== */
.topbar{background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:0 20px;min-height:58px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.topbar .logo{display:flex;align-items:center;gap:9px;margin-right:4px}
.topbar .logo .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2dd4bf,#0f766e);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;font-size:18px}
.topbar h1{font-size:15px;font-weight:900;white-space:nowrap;line-height:1.2}
.topbar h1 small{display:block;font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:1px}
.cls-tabs{display:inline-flex;background:#e9efed;border-radius:10px;padding:3px;gap:2px}
.cls-tabs button{padding:6px 16px;border-radius:8px;font-size:14px;color:var(--ink2);font-weight:600;transition:all .15s}
.cls-tabs button.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.topbar .spacer{flex:1}
.topbar .actions{display:flex;gap:6px;flex-wrap:wrap}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;transition:all .15s;white-space:nowrap;border:1px solid transparent}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-d)}
.btn-amber{background:var(--amber-d);color:#fff}
.btn-amber:hover{background:#92400e}
.btn-ghost{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#fff;border-color:#f3c1c1;color:var(--danger)}
.btn-danger:hover{background:var(--danger-l)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{background:#166534}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:6px}
.btn-lg{padding:12px 28px;font-size:16px;border-radius:12px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);border:1px solid var(--line2);background:#fff;transition:all .15s}
.icon-btn:hover{color:var(--brand);border-color:var(--brand)}
.icon-btn svg{width:15px;height:15px}

/* ===== 统计栏 ===== */
.stats-bar{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 20px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.stats-bar .stat{display:flex;align-items:center;gap:5px}
.stats-bar .stat b{font-size:15px;font-weight:800}
.stats-bar .stat .lbl{color:var(--ink3)}
.stats-bar .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stats-bar .dot.boy{background:var(--boy-b)}
.stats-bar .dot.girl{background:var(--girl-b)}
.stats-bar .dot.wait{background:var(--ink3)}
.stats-bar .dot.ans{background:var(--ok)}
.stats-bar .spacer{flex:1}

/* ===== 主区域 ===== */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;padding:16px 20px 40px;align-items:start;max-width:1600px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h2{font-size:15px;font-weight:700;flex:1}
.card-h .sub{font-size:12px;color:var(--ink3);font-weight:400}
.muted{color:var(--ink3);font-size:12px}
.flex{display:flex;gap:10px;align-items:center}
.flex.between{justify-content:space-between}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%}

/* ===== 座位舞台 ===== */
.stage-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;overflow:hidden;position:relative}
.stage-tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.stage-body{display:flex;flex-direction:column;align-items:center}
.stage-body.flip{flex-direction:column-reverse}
.board{position:relative;margin:0 auto;width:max-content}
.podium{background:linear-gradient(180deg,#0f766e,#0b4f4a);color:#fff;text-align:center;padding:8px 26px;border-radius:9px;font-weight:800;font-size:14px;letter-spacing:5px;width:max-content;margin:0 0 18px;box-shadow:0 4px 12px rgba(11,79,74,.22);flex:none}
.stage-body.flip .podium{margin:18px 0 0}
.row{display:flex;margin-bottom:5px;justify-content:center}
.row:last-child{margin-bottom:0}
.seat{position:relative;width:78px;height:40px;border-radius:7px;border:2px solid #cbd9d4;background:#fff;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:4px;cursor:pointer;user-select:none;transition:transform .1s,box-shadow .12s,border-color .12s;padding:2px 6px}
.seat:hover{border-color:var(--brand);box-shadow:0 3px 12px rgba(15,118,110,.18);transform:translateY(-1px)}
.seat.g-boy{background:var(--boy);border-color:var(--boy-b)}
.seat.g-boy .nm{color:var(--boy-t)}
.seat.g-girl{background:var(--girl);border-color:var(--girl-b)}
.seat.g-girl .nm{color:var(--girl-t)}
.seat.empty{background:#f6f8f7;border-style:dashed;border-color:#d4ddd9}
.seat.empty .nm{color:var(--ink3);font-size:12px}
.seat .sno{font-size:10px;color:#9db0aa;font-weight:700;line-height:1;flex:none}
.seat .nm{font-size:14px;font-weight:800;text-align:center;line-height:1.1;max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .ans-mark{position:absolute;bottom:-1px;right:3px;font-size:10px;color:var(--ok);font-weight:900;line-height:1}
.seat.rolling{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.55),0 0 18px rgba(245,158,11,.5);transform:scale(1.08);z-index:5}
.seat.picked{border-color:var(--ok);box-shadow:0 0 0 3px rgba(21,128,61,.5),0 0 20px rgba(21,128,61,.45);transform:scale(1.06);z-index:5;animation:pulse 1.2s ease infinite}
.seat.dragging,.stu-chip.dragging{opacity:.4}
.seat.drag-over{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.45);transform:scale(1.06);z-index:6}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(21,128,61,.5),0 0 20px rgba(21,128,61,.45)}50%{box-shadow:0 0 0 5px rgba(21,128,61,.35),0 0 30px rgba(21,128,61,.6)}}
.legend{display:flex;gap:14px;align-items:center;margin-top:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:16px;height:12px;border-radius:3px;border:1.5px solid;display:inline-block}
.legend .sw.boy{background:var(--boy);border-color:var(--boy-b)}
.legend .sw.girl{background:var(--girl);border-color:var(--girl-b)}
.legend .sw.wait{background:#fff;border-color:var(--line2);border-style:dashed}
.legend .sw.ans{background:#fff;border-color:var(--ok)}

/* ===== 点名面板 ===== */
.roll-box{background:linear-gradient(160deg,#0f766e,#0b4f4a);border-radius:var(--r);padding:20px;color:#fff;text-align:center;margin-bottom:14px;box-shadow:0 8px 24px rgba(11,79,74,.3)}
.roll-display{min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin-bottom:14px}
.roll-display .big{font-size:34px;font-weight:900;letter-spacing:2px;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.roll-display .sub{font-size:12px;color:rgba(255,255,255,.75)}
.roll-display.rolling .big{animation:flicker .08s linear infinite}
@keyframes flicker{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.roll-btn{width:100%;padding:14px;font-size:17px;font-weight:800;border-radius:12px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.4);transition:all .15s;letter-spacing:2px}
.roll-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(217,119,6,.5)}
.roll-btn:active{transform:translateY(0)}
.roll-btn.stop{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 4px 14px rgba(220,38,38,.4)}
.roll-opts{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:12px;color:rgba(255,255,255,.85)}
.roll-opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
.roll-opts input{accent-color:#f59e0b}
.roll-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.roll-stats .rs{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.roll-stats .rs b{display:block;font-size:20px;font-weight:900;line-height:1.1}
.roll-stats .rs span{font-size:11px;color:var(--ink3)}
.roll-actions{display:flex;gap:8px;margin-bottom:14px}
.roll-actions .btn{flex:1}

/* ===== 语音控制 ===== */
.voice-bar{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:10px}
.voice-btn{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;transition:all .15s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.voice-btn:hover{background:rgba(255,255,255,.3)}
.voice-btn.active{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 0 0 3px rgba(239,68,68,.3);animation:voicepulse 1.2s ease-in-out infinite}
.voice-btn.ready{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 0 0 3px rgba(34,197,94,.35);animation:voicepulse 1.2s ease-in-out infinite}
@keyframes voicepulse{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.3)}50%{box-shadow:0 0 0 8px rgba(239,68,68,.1)}}
.voice-status{flex:1;font-size:12px;color:rgba(255,255,255,.8);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.voice-status .cmd{color:#fde047;font-weight:700}
.voice-hint{font-size:11px;color:rgba(255,255,255,.55);margin-top:6px;line-height:1.5}

/* ===== 设置弹窗 ===== */
.modal-head{flex:none}
.modal-body{flex:1;overflow-y:auto;padding:18px 20px;-webkit-overflow-scrolling:touch}
.modal-foot{flex:none;display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#fafcfb}
.settings-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid var(--line);padding-bottom:0}
.settings-tabs button{padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;color:var(--ink2);background:transparent;transition:all .15s;margin-bottom:-2px}
.settings-tabs button.active{color:var(--brand);background:var(--brand-l);border-bottom:2px solid var(--brand)}
.cmd-group{margin-bottom:14px}
.cmd-group label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
.cmd-group label .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--brand-l);color:var(--brand);margin-left:6px;font-weight:600}
.cmd-group input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.cmd-group .hint{font-size:11px;color:var(--ink3);margin-top:3px}
.effect-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.effect-card{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;background:var(--panel)}
.effect-card:hover{border-color:var(--brand-l)}
.effect-card.active{border-color:var(--brand);background:var(--brand-l)}
.effect-card .icon{font-size:28px;margin-bottom:6px}
.dur-cards{display:flex;gap:8px;flex-wrap:wrap}
.dur-card{border:2px solid var(--line);border-radius:10px;padding:8px 18px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--panel);transition:all .15s}
.dur-card:hover{border-color:var(--brand-l)}
.dur-card.active{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.effect-card .name{font-size:13px;font-weight:700;color:var(--ink)}
.effect-card .desc{font-size:11px;color:var(--ink3);margin-top:2px}
.gif-upload{border:2px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .15s}
.gif-upload:hover{border-color:var(--brand);background:var(--brand-l)}
.gif-upload .gif-preview{max-width:120px;max-height:120px;border-radius:8px;margin:0 auto 8px;display:block}
.gif-layer{position:fixed;inset:0;pointer-events:none;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.gif-layer img{max-width:60vw;max-height:60vh;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:gifpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes gifpop{0%{transform:scale(.3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* ===== 侧栏标签 ===== */
.seg{display:flex;background:#e9efed;border-radius:10px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:12.5px;color:var(--ink2);font-weight:600;transition:all .15s}
.seg button.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ===== 点名记录 ===== */
.hist-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.hist-item:last-child{border-bottom:none}
.hist-item .idx{width:22px;height:22px;border-radius:50%;background:var(--brand-l);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.hist-item .nm{font-weight:700;flex:1}
.hist-item .tm{color:var(--ink3);font-size:11px}
.hist-item .seat-tag{font-size:10px;background:var(--brand-l);color:var(--brand);padding:1px 6px;border-radius:4px;font-weight:600}

/* ===== 名单编辑表格 ===== */
.roster-table{width:100%;border-collapse:collapse;font-size:12.5px}
.roster-table th{background:#f4f7f6;color:var(--ink2);font-weight:700;padding:7px 6px;text-align:left;font-size:11.5px;border-bottom:2px solid var(--line);position:sticky;top:0}
.roster-table td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.roster-table tr:hover td{background:#f8faf9}
.roster-table .seat-no{font-weight:800;color:var(--brand);width:40px;text-align:center}
.roster-table .name{font-weight:700;min-width:60px}
.roster-table .name.boy{color:var(--boy-t)}
.roster-table .name.girl{color:var(--girl-t)}
.roster-table .name.wait{color:var(--ink3)}
.roster-table select{padding:3px 6px;font-size:12px;width:100%;min-width:56px}
.roster-table input{padding:3px 6px;font-size:12px;width:100%;min-width:50px}
.roster-table .op{width:50px;text-align:center}
.roster-table .op .btn{padding:2px 7px;font-size:11px}
.roster-wrap{max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.roster-toolbar{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.roster-toolbar input{flex:1;min-width:100px}

/* ===== 未安排 ===== */
.stu-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;background:#fff;border:1px solid var(--line2);font-size:12px;font-weight:600;margin:3px;cursor:grab;transition:all .12s}
.stu-chip:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(15,118,110,.12)}
.stu-chip .av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.stu-chip .av.boy{background:var(--boy);color:var(--boy-t)}
.stu-chip .av.girl{background:var(--girl);color:var(--girl-t)}
.stu-chip .av.wait{background:var(--brand-l);color:var(--brand)}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,30,27,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:480px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;animation:pop .2s ease}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);font-size:16px;font-weight:800}
.modal-h .close{margin-left:auto;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:18px;cursor:pointer;transition:all .12s;flex:none}
.modal-h .close:hover{background:var(--danger-l);color:var(--danger)}
.modal-b{padding:18px 20px;overflow-y:auto;flex:1}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#fafcfb}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}

/* ===== Toast ===== */
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:1200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#12312c;color:#eaf6f3;padding:9px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s ease;max-width:80vw}
.toast.err{background:#7f1d1d}
.toast.ok{background:#14532d}
@keyframes tin{0%{transform:translateY(-12px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ===== 头像弹窗 ===== */
.avatar-pop-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:150;display:flex;align-items:center;justify-content:center;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.avatar-pop{background:linear-gradient(160deg,#ffffff,#f0f7f5);border-radius:24px;padding:36px 48px 32px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:popin .35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;position:relative;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.avatar-pop-mask.shift .avatar-pop{transform:translateX(calc(-50% - 14px))}
@keyframes popin{0%{transform:scale(.5) translateY(30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.avatar-pop .close-x{position:absolute;top:12px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:18px;color:#666;cursor:pointer;transition:all .15s}
.avatar-pop .close-x:hover{background:#dc2626;color:#fff}
.avatar-pop .av-ring{width:200px;height:200px;border-radius:50%;margin:0 auto 18px;padding:6px;background:conic-gradient(from 0deg,#ef4444,#f59e0b,#ef4444);box-shadow:0 0 0 4px #fff,0 0 30px rgba(239,68,68,.5),0 10px 30px rgba(0,0,0,.2)}
.avatar-pop .av-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#fff}
.avatar-pop .av-default{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:900;color:#fff;background:linear-gradient(135deg,#0f766e,#14b8a6)}
.avatar-pop .av-default.boy{background:linear-gradient(135deg,#2563eb,#60a5fa)}
.avatar-pop .av-default.girl{background:linear-gradient(135deg,#db2777,#f472b6)}
.avatar-pop .pname{font-size:42px;font-weight:900;color:#0f172a;letter-spacing:4px;margin-bottom:6px;text-shadow:0 2px 4px rgba(0,0,0,.08)}
.avatar-pop .pinfo{font-size:15px;color:#64748b;font-weight:600}
.avatar-pop .pinfo span{display:inline-block;margin:0 6px;padding:3px 12px;border-radius:20px;background:#e2e8f0}
.avatar-pop .pinfo span.boy{background:#dbeafe;color:#1d4ed8}
.avatar-pop .pinfo span.girl{background:#fce7f3;color:#be185d}

  0%{transform:translateY(0) scale(1);opacity:1}
  70%{opacity:1}
  100%{transform:translateY(var(--rise)) scale(.7);opacity:.9}
}
.burst-flash{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,240,180,.6) 30%,rgba(255,200,80,.2) 60%,transparent 75%);animation:flash-pop .5s ease-out forwards;pointer-events:none;z-index:1}
@keyframes flash-pop{
  0%{transform:translate(-50%,-50%) scale(0);opacity:1}
  40%{transform:translate(-50%,-50%) scale(1);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(1.6);opacity:0}
}
.spark{position:absolute;border-radius:50%;animation:spark-burst ease-out forwards;will-change:transform,opacity}
.spark.glow{box-shadow:0 0 8px currentColor,0 0 16px currentColor,0 0 28px rgba(255,255,255,.3)}
.spark.big{box-shadow:0 0 12px currentColor,0 0 24px currentColor,0 0 40px rgba(255,255,255,.4)}
.spark::after{content:'';position:absolute;top:50%;left:50%;width:40%;height:2px;background:linear-gradient(to right,currentColor,transparent);transform:translate(-100%,-50%);opacity:.5;border-radius:1px}
.ribbon{position:absolute;top:-30px;border-radius:3px;opacity:.92;animation:ribbon-fall linear forwards;will-change:transform,opacity}
.ribbon.wide{border-radius:2px}
@keyframes ribbon-fall{
  0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:1}
  25%{transform:translateY(25vh) rotate(180deg) translateX(15px)}
  50%{transform:translateY(50vh) rotate(360deg) translateX(-10px);opacity:.95}
  75%{transform:translateY(75vh) rotate(540deg) translateX(12px)}
  100%{transform:translateY(108vh) rotate(720deg) translateX(0);opacity:.7}
}
@keyframes spark-burst{
  0%{transform:translate(-50%,-50%) scale(1.6);opacity:1}
  18%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1.1);opacity:1}
  40%{transform:translate(calc(-50% + var(--tx)*1.06),calc(-50% + var(--ty) + 8vh)) scale(.95);opacity:.92}
  60%{transform:translate(calc(-50% + var(--tx)*1.1),calc(-50% + var(--ty) + 25vh)) scale(.8);opacity:.72}
  78%{transform:translate(calc(-50% + var(--tx)*1.14),calc(-50% + var(--ty) + 48vh)) scale(.62);opacity:.45}
  90%{transform:translate(calc(-50% + var(--tx)*1.18),calc(-50% + var(--ty) + 65vh)) scale(.45);opacity:.2}
  100%{transform:translate(calc(-50% + var(--tx)*1.22),calc(-50% + var(--ty) + 82vh)) scale(.3);opacity:0}
}

/* 加油文字特效 */
.cheer-layer{position:fixed;inset:0;pointer-events:none;z-index:300;display:flex;align-items:center;justify-content:center}
.cheer-big{font-size:88px;font-weight:900;color:#ffd93b;background:linear-gradient(180deg,#22c55e,#16a34a);padding:20px 56px;border-radius:28px;display:inline-block;box-shadow:0 10px 40px rgba(22,163,74,.45),inset 0 -4px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 3px 8px rgba(0,0,0,.35);letter-spacing:8px;animation:cheer-in .55s cubic-bezier(.34,1.56,.64,1) forwards}
.cheer-big.fading,.praise-big.fading{transition:opacity .6s,transform .6s;opacity:0;transform:scale(.85)}
@keyframes cheer-in{0%{transform:scale(.2) rotate(-10deg);opacity:0}18%{transform:scale(1.25) rotate(3deg);opacity:1}38%{transform:scale(1) rotate(0deg);opacity:1}100%{transform:scale(1);opacity:1}}

.cheer-layer.side,.praise-layer.side{justify-content:flex-start;padding-left:calc(50vw + 14px)}

const LS_KEY = 'rollcall-app-v2';
let S = null;
function newClass(name, data){

    return { id:uid('s'), n:d[0], g:d[1]||'', no:d[2]||'', x:c.x||0, y:c.y||0, rk:i+1, avatar:'' };
  });

}

function load(){
  let local = null;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ local = JSON.parse(raw); }
  }catch(e){}
  const ext = window.ROLLCALL_DATA || null;
  if(ext){
    // 数据文件优先；若本地有更新的改动（updatedAt 更大）则保留本地
    if(!local || (ext.updatedAt||0) >= (local.updatedAt||0)) S = ext;
    else S = local;
    if(S === ext){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
  } else if(local){
    S = local;
  }
  if(!S) S = freshState();
  // 兼容旧数据，补全设置字段
  if(!S.title) S.title = '五中初二语文课点名系统';
  if(!S.voiceCommands) S.voiceCommands = JSON.parse(JSON.stringify(DEFAULT_VOICE_CMDS));
  if(!S.likeEffect) S.likeEffect = 'firework';
  if(!S.fxDuration) S.fxDuration = 10;
  if(S.voiceName === undefined) S.voiceName = true;
  if(S.voiceSeat === undefined) S.voiceSeat = true;
  if(S.likeGif === undefined) S.likeGif = '';
  if(S.likeSound === undefined) S.likeSound = '';
  ensureAvatars();
}
function ensureAvatars(){
  if(typeof AVATAR_POOL === 'undefined' || !AVATAR_POOL.length) return;
  let changed = false;
  Object.values(S.classes).forEach(cc => {
    cc.students.forEach(s => {
      if(!hasAvatar(s)){
        s.avatar = AVATAR_POOL[Math.floor(Math.random()*AVATAR_POOL.length)];
        changed = true;
      }
    });
  });
  if(changed) save();
}
function compressImage(dataUrl, max, quality){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ res(dataUrl); return; }
      const m = Math.max(w, h);
      if(m > max){ w = Math.round(w*max/m); h = Math.round(h*max/m); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0,0,w,h);
      x.drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
// 剔除原图备份的轻量副本：本地只存压缩头像，原图 avatarFull 仅在内存（导出数据文件时用）
function toSlim(src){
  try{ return JSON.parse(JSON.stringify(src, (k,v) => k === 'avatarFull' ? undefined : v)); }catch(e){ return src; }
}
async function compressAllAvatars(max, quality){
  const jobs = [];
  Object.values(S.classes).forEach(cc => cc.students.forEach(s => {
    if(hasAvatar(s)){
      // 已压缩过且已备份原图 → 跳过，避免反复压糊
      if(s.avatarFull && s.avatar && s.avatar.length < 30000) return;
      jobs.push(compressImage(s.avatar, max, quality).then(u => {
        if(!s.avatarFull) s.avatarFull = s.avatar;
        s.avatar = u;
      }));
    }
  }));
  await Promise.all(jobs);
  try{ localStorage.setItem(LS_KEY, JSON.stringify(toSlim(S))); return true; }catch(e){ return false; }
}
function save(silent){
  S.updatedAt = Date.now();
  schedulePush();
  // 先写轻量数据（不含 avatarFull 原图），避免 stringify 巨大原图卡顿
  let str = null;
  try{ str = JSON.stringify(toSlim(S)); }catch(e){ return true; }
  try{
    localStorage.setItem(LS_KEY, str);
    return true;
  }catch(e){}
  // 存储超限：逐级压缩头像后重写（内存保留原图，导出数据文件仍为原图）
  (async () => {
    const steps = [[300,0.85],[220,0.8],[160,0.7],[120,0.6]];
    for(const [m,q] of steps){
      if(await compressAllAvatars(m,q)){
        if(!silent) toast('本地空间有限，头像已自动压缩保存；导出数据文件时仍为原图','ok');
        return;

/* ===== 云同步（GitHub 私有 Gist，管理员密码登录后自动拉取/推送） ===== */
const SYNC_KEY = 'rollcall-sync';
let syncCfg = {};
try{ syncCfg = JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; }catch(e){ syncCfg = {}; }
let syncTimer = null;
function persistSyncCfg(){ localStorage.setItem(SYNC_KEY, JSON.stringify(syncCfg)); }
function syncOn(){ return !!(syncCfg.token && isAdminMode()); }
async function gistReq(url, opts){
  const r = await fetch(url, Object.assign({headers:{'Authorization':'token '+syncCfg.token,'Accept':'application/vnd.github+json'}}, opts||{}));
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}
function studentByIdAny(id){
  for(const k in S.classes){ const s = S.classes[k].students.find(x=>x.id===id); if(s) return s; }
  return null;
}
async function findSyncGist(){
  const list = await gistReq('https://api.github.com/gists?per_page=100');
  return list.find(g => g.description === 'rollcall-sync') || null;
}
async function pullCloud(){
  if(!syncOn()) return;
  try{
    const gist = await findSyncGist();
    if(!gist){ console.log('[sync] 云端无数据'); return; }
    syncCfg.gistId = gist.id; persistSyncCfg();
    const df = gist.files['rollcall-data.json'];
    if(!df) return;
    const raw = await (await fetch(df.raw_url)).json();
    if(!raw || !raw.data || !(raw.updatedAt > (S.updatedAt||0))){ console.log('[sync] 本地已是最新'); return; }
    const avMap = {};
    const avFiles = Object.keys(gist.files).filter(f=>f.startsWith('rollcall-av-'));
    for(const fn of avFiles){
      try{ const chunk = await (await fetch(gist.files[fn].raw_url)).json(); Object.assign(avMap, chunk); }catch(e){}
    }
    Object.keys(S).forEach(k => { if(k!=='updatedAt') delete S[k]; });
    Object.assign(S, raw.data);
    S.updatedAt = raw.updatedAt;
    Object.values(S.classes).forEach(cc => cc.students.forEach(st => { if(avMap[st.id] !== undefined) st.avatar = avMap[st.id]; }));
    save(true);
    if(typeof renderStats==='function') renderStats();
    if(typeof renderBoard==='function') renderBoard();
    if(typeof renderHistory==='function') renderHistory();
    toast('已从云端同步最新数据','ok');
  }catch(e){ console.warn('[sync] 拉取失败', e); toast('云同步拉取失败：'+(e.message||'网络错误'),'err'); }
}
async function pushCloud(){
  if(!syncOn()) return;
  try{
    S.updatedAt = Date.now();
    try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
    const chunks = {}; let buf = {}, size = 0, idx = 0;
    const put = (sid, av) => { const add = av.length + 24; if(size + add > 450000 && Object.keys(buf).length){ chunks['rollcall-av-'+idx+'.json'] = JSON.stringify(buf); idx++; buf = {}; size = 0; } buf[sid] = av; size += add; };
    Object.values(S.classes).forEach(cc => cc.students.forEach(st => { if(hasAvatar(st)) put(st.id, st.avatar); }));
    if(Object.keys(buf).length){ chunks['rollcall-av-'+idx+'.json'] = JSON.stringify(buf); }
    const slim = JSON.parse(JSON.stringify(S));
    Object.values(slim.classes).forEach(cc => cc.students.forEach(st => { st.avatar=''; st.avatarName=''; }));
    const files = {'rollcall-data.json': {content: JSON.stringify({updatedAt: S.updatedAt, data: slim})}};
    Object.keys(chunks).forEach(fn => files[fn] = {content: chunks[fn]});
    if(syncCfg.gistId){
      await gistReq('https://api.github.com/gists/'+syncCfg.gistId, {method:'PATCH', body: JSON.stringify({files})});
    } else {
      const created = await gistReq('https://api.github.com/gists', {method:'POST', body: JSON.stringify({description:'rollcall-sync', public:false, files})});
      syncCfg.gistId = created.id; persistSyncCfg();
    }
    console.log('[sync] 已推送云端');
  }catch(e){ console.warn('[sync] 推送失败', e); }
}
function schedulePush(){ if(!syncOn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushCloud, 4000); }

/* ===== 点名引擎 ===== */
let rolling = false, rollTimer = null, rollPool = [], rollIdx = 0, autoStopTimer = null, autoStopCount = 0;
function getRollPool(){
  const cc = curClass();
  let pool = placedStudents();
  if(S.noRepeat) pool = pool.filter(s => !cc.called.includes(s.id));
  if(!pool.length && S.noRepeat){
    pool = placedStudents();
  }
  return pool;
}
function startRoll(){
  const pool = getRollPool();
  if(!pool.length){ toast('没有可点名的学生','err'); return; }
  rolling = true;
  rollPool = pool;
  autoStopCount = 5;
  $('#roll-btn').textContent = '⏹ 停止 (5s)';

  $('#roll-display').classList.add('rolling');

    if(el) el.classList.add('rolling');
  }, 70);
  // 5秒自动停止，每秒更新倒计时
  autoStopTimer = setInterval(() => {
    autoStopCount--;
    if(autoStopCount > 0){
      $('#roll-btn').textContent = '⏹ 停止 ('+autoStopCount+'s)';
    } else {
      stopRoll();
    }
  }, 1000);
}
function stopRoll(){
  if(!rolling) return;
  clearInterval(rollTimer);
  clearInterval(autoStopTimer);
  autoStopTimer = null;
  rolling = false;
  $('#roll-btn').textContent = '▶ 开始点名';
  $('#roll-btn').classList.remove('stop');
  $('#roll-display').classList.remove('rolling');
  $$('.seat.rolling').forEach(el => el.classList.remove('rolling'));
  // 随机定格

}
function pickStudent(st, manual){
  const cc = curClass();
  if(!cc.called.includes(st.id)) cc.called.push(st.id);
  cc.history.unshift({ id:uid('h'), sid:st.id, n:st.n, seat: st.x?seatNoOf(st.x,st.y):0, time:nowTime(), manual:!!manual });
  if(cc.history.length > 200) cc.history.length = 200;

/* ===== 头像调整器（圆形裁剪/预览/保存） ===== */
function openAvatarEditor(st){
  if(!st || !hasAvatar(st)){ toast('该学生还没有头像，请先导入','err'); return; }
  if(!isVip()){ showVipModal('调整头像'); return; }
  if($('#av-edit-modal')) return;
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'av-edit-modal';
  mask.style.zIndex = '500';
  mask.innerHTML = `
    <div class="modal" style="max-width:560px">
      <div class="modal-head">✂ 调整头像：${esc(st.n)}<span class="close-x">✕</span></div>
      <div class="modal-body" style="text-align:center">
        <div class="av-edit-stage" id="ae-stage">
          <canvas id="ae-canvas" width="360" height="360"></canvas>
        </div>
        <div class="hint" style="margin:10px 0 4px">拖动图片调整位置 · 滚轮或按钮缩放 · 圆圈内为保存效果</div>
        <div class="av-edit-ctrl">
          <button class="btn btn-ghost btn-sm" id="ae-out">－ 缩小</button>
          <button class="btn btn-ghost btn-sm" id="ae-reset">居中</button>
          <button class="btn btn-ghost btn-sm" id="ae-in">＋ 放大</button>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="ae-cancel">取消</button>
        <button class="btn btn-brand" id="ae-save">💾 保存头像</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  const img = new Image();
  img.onload = () => {
    let z = 1, dx = 0, dy = 0;
    const D = 360;
    const base = D / Math.min(img.naturalWidth, img.naturalHeight);
    const cv = mask.querySelector('#ae-canvas');
    const ctx = cv.getContext('2d');
    function render(){
      const w = img.naturalWidth * base * z;
      const h = img.naturalHeight * base * z;
      ctx.clearRect(0,0,D,D);
      ctx.save();
      ctx.beginPath();
      ctx.arc(D/2, D/2, D/2, 0, Math.PI*2);
      ctx.clip();
      ctx.drawImage(img, D/2 - w/2 + dx, D/2 - h/2 + dy, w, h);
      ctx.restore();
      ctx.beginPath(); ctx.arc(D/2, D/2, D/2-0.5, 0, Math.PI*2);
      ctx.strokeStyle = '#0f766e'; ctx.lineWidth = 2; ctx.stroke();
    }
    render();
    let dragging = false, sx=0, sy=0, ox=0, oy=0;
    cv.addEventListener('pointerdown', e => { dragging=true; sx=e.clientX; sy=e.clientY; ox=dx; oy=dy; try{cv.setPointerCapture(e.pointerId);}catch(err){} });
    cv.addEventListener('pointermove', e => { if(!dragging) return; dx=ox+(e.clientX-sx); dy=oy+(e.clientY-sy); render(); });
    cv.addEventListener('pointerup', () => dragging=false);
    cv.addEventListener('pointercancel', () => dragging=false);
    cv.addEventListener('wheel', e => { e.preventDefault(); z = Math.min(5, Math.max(0.5, z*(e.deltaY<0?1.12:1/1.12))); render(); }, {passive:false});
    mask.querySelector('#ae-in').onclick = () => { z = Math.min(5, z*1.2); render(); };
    mask.querySelector('#ae-out').onclick = () => { z = Math.max(0.5, z/1.2); render(); };
    mask.querySelector('#ae-reset').onclick = () => { z=1; dx=0; dy=0; render(); };
    mask.querySelector('#ae-save').onclick = () => {
      const out = document.createElement('canvas'); out.width=512; out.height=512;
      const octx = out.getContext('2d');
      const k = 512/D;
      const ow = img.naturalWidth * base * z * k;
      const oh = img.naturalHeight * base * z * k;
      octx.clearRect(0,0,512,512);
      octx.save();
      octx.beginPath(); octx.arc(256,256,256,0,Math.PI*2); octx.clip();
      octx.drawImage(img, 256 - ow/2 + dx*k, 256 - oh/2 + dy*k, ow, oh);
      octx.restore();
      const dataUrl = out.toDataURL('image/png');
      st.avatar = dataUrl;
      st.avatarName = 'edited-'+Date.now()+'.png';
      save(); render();
      mask.remove();
      toast('头像已保存','ok');
      const pop = $('#avatar-pop-mask');
      if(pop) pop.remove();
      showAvatarPop(st);
    };
    mask.querySelector('#ae-cancel').onclick = () => mask.remove();
    mask.querySelector('.close-x').onclick = () => mask.remove();
    mask.onclick = e => { if(e.target === mask) mask.remove(); };
  };
  img.onerror = () => { toast('头像图片加载失败','err'); mask.remove(); };
  img.src = st.avatar;
}

function playCheerSound(){
  // 优先播放自定义音效
  if(S.likeSound){
    try{
      const audio = new Audio(S.likeSound);
      audio.volume = 0.8;
      window._fxAudio = audio;
      audio.play().catch(()=>{});
      return;
    }catch(e){}
  }
  // 默认合成欢呼声
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    window._fxAudioCtx = ctx;
    const now = ctx.currentTime;
    // 上升音阶：C4 E4 G4 C5 E5 G5（胜利号角感）
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const t = now + i * 0.12;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    });
    // 最后一个长音 G5 持续
    const longOsc = ctx.createOscillator();
    const longGain = ctx.createGain();
    longOsc.type = 'triangle';
    longOsc.frequency.value = 783.99;
    const lt = now + 0.72;
    longGain.gain.setValueAtTime(0, lt);
    longGain.gain.linearRampToValueAtTime(0.22, lt + 0.05);
    longGain.gain.exponentialRampToValueAtTime(0.001, lt + 1.2);
    longOsc.connect(longGain).connect(ctx.destination);
    longOsc.start(lt);
    longOsc.stop(lt + 1.3);
    // 人群欢呼声（白噪声+带通滤波，模拟"哇哦"）
    const noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for(let i=0;i<data.length;i++){ data[i] = (Math.random()*2-1) * 0.3; }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(800, now);
    bp.frequency.linearRampToValueAtTime(1600, now + 0.8);
    bp.Q.value = 2;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0, now);
    noiseGain.gain.linearRampToValueAtTime(0.12, now + 0.3);
    noiseGain.gain.linearRampToValueAtTime(0.08, now + 1.0);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    noise.connect(bp).connect(noiseGain).connect(ctx.destination);
    noise.start(now);
    noise.stop(now + 1.5);
    // 自动关闭 AudioContext
    setTimeout(() => ctx.close(), 2500);
  }catch(e){}
}

/* ===== 渲染：座位图 ===== */
function renderBoard(){
  const ly = S.layout, cc = curClass();
  const byKey = {};
  cc.students.forEach(s => { if(s.x>0 && s.y>0) byKey[seatKey(s.x,s.y)] = s; });
  const groups = ly.colGroups && ly.colGroups.length ? ly.colGroups : [ly.cols];
  const placed = placedStudents().length;
  const empty = ly.cols*ly.rows - placed;
  $('#stage-info').textContent = `共 ${cc.students.length} 人 · 已安排 ${placed} 人 · 空座 ${empty} 个 · 座位号=排×10+列`;
  $('#podium').textContent = cc.name + ' · 讲 台';
  $('#stage-body').classList.toggle('flip', S.flipPodium);
  let html = '';
  const rows = S.flipPodium ? [...Array(ly.rows)].map((_,i)=>ly.rows-i) : [...Array(ly.rows)].map((_,i)=>i+1);
  for(const y of rows){
    html += '<div class="row">';
    let gIdx = 0, inGroup = 0;
    for(let x=1; x<=ly.cols; x++){
      if(inGroup >= groups[gIdx]){ html += '<div style="width:18px"></div>'; gIdx++; inGroup=0; }
      inGroup++;
      const st = byKey[seatKey(x,y)];
      const no = seatNoOf(x,y);
      const gcls = st ? (st.g==='男'?' g-boy':st.g==='女'?' g-girl':'') : ' empty';
      const ansMark = st && cc.called.includes(st.id) ? '<span class="ans-mark">✓</span>' : '';
      html += `<div class="seat${gcls}" data-key="${x}-${y}" data-x="${x}" data-y="${y}" data-sid="${st?st.id:''}">
        <span class="sno">${no}</span>
        ${st ? `<span class="nm">${esc(st.n)}</span>${ansMark}` : '<span class="nm">空</span>'}
      </div>`;
    }
    html += '</div>';
  }
  $('#board').innerHTML = html;
  $$('#board .seat').forEach(el => {
    // 点名字弹头像；点座位其他区域打开编辑弹窗
    const nm = el.querySelector('.nm');
    if(nm){
      nm.onclick = ev => {
        ev.stopPropagation();
        const [x,y] = el.dataset.key.split('-').map(Number);
        const st = studentAt(x,y);
        if(st) showAvatarPop(st);
      };
    }
    el.onclick = () => seatClick(el.dataset.key, el);
    bindDragEl(el);
  });
  fitBoard();
}

/* ===== 座位图自适应缩放 ===== */
function fitBoard(){
  const board = $('#board');
  if(!board) return;
  const wrap = $('#stage');
  const wrapW = wrap.clientWidth - 36;
  const wrapH = window.innerHeight - 250;
  const boardW = board.scrollWidth;
  const boardH = board.scrollHeight;
  const scale = Math.min(wrapW / boardW, wrapH / boardH);
  board.style.zoom = scale;
}

/* ===== 拖拽 ===== */
let dragEl = null, dSX=0, dSY=0, dMoved=false, suppressClick=false;
function bindDragEl(el){
  el.addEventListener('pointerdown', e => {
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target.closest('button') || e.target.tagName==='SELECT' || e.target.tagName==='INPUT') return;
    const seat = el.classList.contains('seat') ? el : null;
    const chip = el.classList.contains('stu-chip') ? el : null;
    if(!seat && !chip) return;
    if(!isVip()){ showVipModal('拖拽换座'); return; }
    suppressClick = false;
    dragEl = { el, seat: seat ? seat.dataset.key : null, sid: chip ? chip.dataset.sid : (seat ? (seat.dataset.sid || null) : null) };
    dSX = e.clientX; dSY = e.clientY; dMoved = false;
    el.classList.add('dragging');
    e.preventDefault();
  });
}
window.addEventListener('pointermove', e => {
  if(!dragEl) return;
  if(Math.abs(e.clientX-dSX)+Math.abs(e.clientY-dSY) > 5) dMoved = true;
  if(!dMoved) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const over = t && t.closest ? t.closest('.seat') : null;
  $$('.seat.drag-over').forEach(x => x.classList.remove('drag-over'));
  if(over) over.classList.add('drag-over');
});
window.addEventListener('pointerup', e => {
  if(!dragEl) return;
  const t = document.elementFromPoint(e.clientX, e.clientY);
  const over = t && t.closest ? t.closest('.seat') : null;
  dragEl.el.classList.remove('dragging');
  $$('.seat.drag-over').forEach(x => x.classList.remove('drag-over'));
  if(over && over.dataset.key !== dragEl.seat){
    doAssign(dragEl.sid, dragEl.seat, over.dataset.key);
    suppressClick = true;
  }
  dragEl = null;
});
function doAssign(sid, fromKey, toKey){
  const [tx,ty] = toKey.split('-').map(Number);
  const st = studentById(sid);
  if(!st) return;
  const occ = studentAt(tx,ty);
  if(occ && occ.id === sid) return;
  if(fromKey){
    const [fx,fy] = fromKey.split('-').map(Number);
    if(occ){ occ.x = fx; occ.y = fy; }
  } else if(occ){
    toast('座位 '+toKey+' 已被 '+occ.n+' 占用','err');
    return;
  }
  st.x = tx; st.y = ty;
  save(); render();
  toast(st.n + (occ ? ' 与 '+occ.n+' 互换' : ' → 座位 '+toKey), 'ok');
}

function autoSeat(){
  const cc = curClass(), ly = S.layout;
  const unplaced = unplacedStudents().sort((a,b)=>(a.rk||9999)-(b.rk||9999));
  let idx = 0;
  for(let y=1; y<=ly.rows && idx<unplaced.length; y++){
    const xs = []; for(let x=1;x<=ly.cols;x++) xs.push(x);
    if(y%2===0) xs.reverse();
    for(const x of xs){ if(idx>=unplaced.length) break; if(!studentAt(x,y)){ unplaced[idx].x=x; unplaced[idx].y=y; idx++; } }
  }
  save(); render();
  toast('自动入座完成：新安排 '+idx+' 人','ok');
}
function clearSeats(){
  const cc = curClass();
  cc.students.forEach(s => { s.x=0; s.y=0; });
  cc.called = []; cc.history = [];
  save(); render();
  toast('已清空所有座位和点名记录','ok');

/* ===== 导入名单 ===== */
function detectDelim(text){
  const sample = text.split(/\r?\n/).slice(0,6).join('\n');
  let best='\t', bestN=0;
  [',','，',';','\t','  ','　'].forEach(d => { const n = sample.split(d).length; if(n>bestN){ bestN=n; best=d; } });
  return best;
}
function parseRosterText(text){
  const delim = detectDelim(text);
  const rows = text.split(/\r?\n/).map(l => l.replace(/\r$/,'').split(delim).map(c=>c.trim())).filter(r => r.some(c=>c!==''));
  if(!rows.length) return [];
  const kw = ['班级','姓名','名字','name','学号','性别','座位号','横坐标','纵坐标','列','排','x','y','语文排名','排名','头像','avatar','photo','照片'];
  const isHeader = rows[0].some(c => kw.includes(c.toLowerCase()) || /班级|姓名|学号|性别|座位|坐标|排名/.test(c));
  const hdr = isHeader ? rows.shift() : null;
  const findIdx = names => hdr ? hdr.findIndex(c => names.some(n => c.toLowerCase()===n || (n.length>=2 && (c.includes(n)||n.includes(c))))) : -1;
  const iCls = findIdx(['班级']);
  const iN = hdr ? findIdx(['姓名','名字','name']) : 0;
  const iNo = hdr ? findIdx(['学号']) : 1;
  const iG = hdr ? findIdx(['性别']) : 2;
  const iSn = hdr ? findIdx(['座位号','座号']) : 3;
  const iX = hdr ? findIdx(['横坐标','横','列','x']) : 4;
  const iY = hdr ? findIdx(['纵坐标','纵','排','y']) : 5;
  const iRk = hdr ? findIdx(['排名','名次']) : 6;
  const iAv = hdr ? findIdx(['头像','avatar','photo','照片']) : 7;
  const out = [];
  rows.forEach(r => {
    const name = r[iN];
    if(!name) return;
    let x = num(r[iX]), y = num(r[iY]);
    const sn = num(r[iSn]);
    if((!x||!y) && sn && sn>=11){ const c=coordsOf(sn); x=c.x; y=c.y; }
    out.push({
      cls: (r[iCls]||'').trim(), n: name.trim(),
      no: (r[iNo]||'').trim(), g: (r[iG]||'').trim(),
      rk: num(r[iRk])||0,
      avatar: (r[iAv]||'').trim(),
      x: (Number.isInteger(x)&&x>0)?x:0, y: (Number.isInteger(y)&&y>0)?y:0
    });
  });
  return out;
}
function hasAvatar(st){
  if(!st || !st.avatar) return false;
  const a = st.avatar;
  return a.startsWith('data:') || a.startsWith('http') || a.startsWith('/') || a.startsWith('blob:');
}
function matchStudentByFile(cc, fname){
  const base = fname.replace(/\.[^.]+$/, '').trim();
  // 1) 精确匹配：姓名 / 学号 / 座位号
  let st = cc.students.find(s => s.n === base)
        || cc.students.find(s => s.no && s.no === base)
        || cc.students.find(s => { const seatNo = (s.y!=null&&s.x!=null) ? (s.y*10+s.x+1) : ''; return String(seatNo) === base; });
  if(st) return st;
  const clean = base.replace(/[_\s]+/g,'');
  // 2) 模糊匹配：文件名中只要包含姓名即可（如 _头像_郭雅轩.jpg）；同名取名字最长者避免误配
  const byName = cc.students.filter(s => s.n && clean.includes(s.n)).sort((a,b) => b.n.length - a.n.length);
  if(byName.length) return byName[0];
  // 3) 学号/座位号：提取文件名中的独立数字段，与学号/座位号完整相等才算匹配（避免 2024011 误命中座位号 11）
  const nums = clean.match(/\d+/g) || [];
  st = cc.students.find(s => s.no && nums.includes(String(s.no)));
  if(st) return st;
  st = cc.students.find(s => {
    const seatNo = (s.y!=null&&s.x!=null) ? (s.y*10+s.x+1) : '';
    return seatNo && nums.includes(String(seatNo));
  });
  return st;
}

  };

  $('#imp-file').onchange = e => {

    if(low.endsWith('.xlsx') || low.endsWith('.xls')){

        }

      reader.readAsArrayBuffer(f);

      const reader = new FileReader();
      reader.onload = ev => { $('#imp-text').value = ev.target.result; apply(ev.target.result); };
      reader.readAsText(f, 'UTF-8');
    }

    parsed.forEach(p => { const k = p.cls || S.cur; (byCls[k]=byCls[k]||[]).push(p); });
    const allCC = [];
    Object.entries(byCls).forEach(([cls, list]) => {
      if(!S.classes[cls]) S.classes[cls] = { name:cls, students:[], history:[], called:[], placed:true };
      const cc = S.classes[cls];
      allCC.push(cc);
      if(mode===0){
        cc.students = list.map((p,i)=>({ id:uid('s'), n:p.n, no:p.no, g:p.g, rk:p.rk||i+1, x:p.x, y:p.y, avatar:p.avatar||'' }));
        cc.called = []; cc.history = [];
      } else {
        list.forEach(p => {
          const ex = cc.students.find(s=>s.n===p.n);
          if(ex){ ex.g=p.g||ex.g; ex.no=p.no||ex.no; if(p.avatar) ex.avatar=p.avatar; if(p.x){ex.x=p.x;ex.y=p.y;} }
          else cc.students.push({ id:uid('s'), n:p.n, no:p.no, g:p.g, rk:p.rk||cc.students.length+1, x:p.x, y:p.y, avatar:p.avatar||'' });
        });
      }
    });
    if(parsed.some(p=>p.cls)) S.cur = Object.keys(byCls)[0];
    // 头像文件按文件名匹配
    const tasks = [];
    avFiles.forEach(file => {
      for(let i=0;i<allCC.length;i++){
        const st = matchStudentByFile(allCC[i], file.name);
        if(st){ tasks.push({st, file}); break; }
      }
    });
    if(!tasks.length){
      save(); closeModal(); render();
      toast('导入完成：'+parsed.length+' 人','ok');
      return;
    }
    let done = 0;
    tasks.forEach(t => {
      const reader = new FileReader();
      reader.onload = async ev => {
        t.st.avatar = ev.target.result;
        t.st.avatarName = t.file.name;
        done++;
        if(done === tasks.length){
          save(); closeModal(); render();
          toast('导入完成：'+parsed.length+' 人，头像匹配 '+tasks.length+' 张','ok');
        }
      };
      reader.readAsDataURL(t.file);
    });
  };
}

      <input type="file" id="av-files" accept="image/*" multiple style="margin-top:6px"></div>
    <div id="av-result" class="muted" style="margin-top:10px"></div>`,
    footer: `<button class="btn btn-ghost" data-c>关闭</button>`
  });
  $('#av-files').onchange = e => {
    const files = [...e.target.files];
    if(!files.length){ return; }
    const cc = curClass();
    let matched = 0, unmatched = [];
    const matchedIds = new Set();
    let pending = files.length;
    files.forEach(file => {
      // 匹配：姓名 → 学号 → 座位号
      let student = matchStudentByFile(cc, file.name);
      if(!student){ unmatched.push(file.name); pending--; if(pending===0) finish(); return; }
      const reader = new FileReader();
      reader.onload = async ev => {
        student.avatar = ev.target.result;
        student.avatarName = file.name;
        if(!matchedIds.has(student.id)){ matchedIds.add(student.id); matched++; }
        pending--;
        if(pending===0) finish();
      };
      reader.onerror = () => { unmatched.push(file.name+'(读取失败)'); pending--; if(pending===0) finish(); };
      reader.readAsDataURL(file);
    });
    function finish(){
      save(); render();
      const unmatchHTML = unmatched.length ? `<br><span style="color:var(--danger)">未匹配 ${unmatched.length} 个：${unmatched.slice(0,8).map(esc).join('、')}${unmatched.length>8?'…':''}</span>` : '';
      $('#av-result').innerHTML = `<b style="color:var(--ok)">成功匹配 ${matched} 人</b>${unmatchHTML}`;
      toast('头像导入完成：成功'+matched+'人'+(unmatched.length?'，未匹配'+unmatched.length+'个':''), unmatched.length?'err':'ok');
    }
  };
}

    const y = flipped ? ly.rows-k : k+1;

    for(let x=1;x<=ly.cols;x++){

      inGroup++;

function exportPNG(){

  const width = groups.reduce((a,g)=>a+g*cellW+(g-1)*gapX,0)+(groups.length-1)*aisle;
  const height = ly.rows*cellH+(ly.rows-1)*gapY;
  const pad=30, podiumH=44;
  const flipped = !!S.flipPodium;
  const cv = document.createElement('canvas');
  cv.width = width+pad*2; cv.height = height+pad*2+podiumH;
  const ctx = cv.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#0f766e';
  const podiumTop = flipped ? height+pad : 16;
  ctx.fillRect(cv.width/2-60, podiumTop, 120, 28);
  ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
  ctx.fillText(cc.name+' 讲台', cv.width/2, podiumTop+20);
  const byKey = {};
  cc.students.forEach(s => { if(s.x>0&&s.y>0) byKey[seatKey(s.x,s.y)] = s; });
  for(let k=0; k<ly.rows; k++){
    const y = flipped ? ly.rows-k : k+1;
    let xPos=pad, gIdx=0, inGroup=0;
    for(let x=1;x<=ly.cols;x++){
      if(inGroup>=groups[gIdx]){ xPos+=aisle; gIdx++; inGroup=0; }
      inGroup++;
      const st = byKey[seatKey(x,y)];
      const bg = st ? (st.g==='男'?'#dbeafe':st.g==='女'?'#fce7f3':'#fff') : '#f6f8f7';
      const bd = st ? (st.g==='男'?'#3b82f6':st.g==='女'?'#ec4899':'#cbd9d4') : '#d4ddd9';
      const yPos = pad+podiumH+(k)*(cellH+gapY);
      ctx.fillStyle=bg; ctx.strokeStyle=bd; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(xPos,yPos,cellW,cellH,8); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#9db0aa'; ctx.font='bold 9px sans-serif'; ctx.textAlign='left';
      ctx.fillText(seatNoOf(x,y), xPos+5, yPos+12);
      if(st){
        ctx.fillStyle = st.g==='男'?'#1d4ed8':st.g==='女'?'#be185d':'#1d2b28';
        ctx.font='bold 13px sans-serif'; ctx.textAlign='center';
        ctx.fillText(st.n, xPos+cellW/2, yPos+cellH/2+2);
        if(st.g||st.no){ ctx.fillStyle='#7a8a85'; ctx.font='8px sans-serif'; ctx.fillText((st.g||'')+(st.no?' · '+st.no:''), xPos+cellW/2, yPos+cellH-6); }
      } else {
        ctx.fillStyle='#b8c6c1'; ctx.font='12px sans-serif'; ctx.textAlign='center';
        ctx.fillText('空', xPos+cellW/2, yPos+cellH/2+4);
      }
      xPos += cellW+gapX;
    }
  }
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = cc.name+'座次表_'+today()+'.png';
  a.click();
  toast('已导出座位图 PNG','ok');
}

/* ===== 语音控制 ===== */
let voiceRec = null, voiceOn = false, voiceRestart = false, voiceLock = false;
function setVoiceStatus(html){ const el = $('#voice-status'); if(el) el.innerHTML = html; }
function initVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ return null; }
  // 语音按钮状态：绿色=后台历史已清空可输入新指令；红色=历史还在/处理中，勿输入
  const voiceBtnReady = () => { const b = $('#voice-btn'); if(!b) return; b.classList.remove('active'); b.classList.add('ready'); b.textContent = '🟢 正在听'; };
  const voiceBtnBusy  = () => { const b = $('#voice-btn'); if(!b) return; b.classList.remove('ready'); b.classList.add('active'); b.textContent = '🔴 正在听'; };
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let heardTimer = null;      // 无语音时清显示
  let silenceTimer = null;    // 一句话静音判定（0.8s 无新内容=说完）
  window._voiceBurntList = window._voiceBurntList || [];   // 焚毁历史文本列表（会话内）
  // 裁剪掉已焚毁的历史指令：旧指令不再显示、不再执行，只留新内容
  const stripBurnt = (t) => {
    if(!t) return '';
    let r = t;
    for(const b of window._voiceBurntList){
      if(!b) continue;
      r = r.split(b).join('');
    }
    return r.trim();
  };
  rec.onstart = () => { voiceOn = true; voiceBtnReady(); setVoiceStatus('正在聆听…说"点名""停止""点赞""加油"'); };
  rec.onend = () => {
    if(voiceRestart){
      // 延迟重启，避免状态冲突；失败则重试一次
      setTimeout(() => {
        if(!voiceRestart) return;
        try{ rec.start(); }catch(e){
          setTimeout(() => { if(voiceRestart){ try{ rec.start(); }catch(err){} } }, 300);
        }
      }, 200);
    } else {
      voiceOn = false; $('#voice-btn').classList.remove('active'); $('#voice-btn').classList.remove('ready'); $('#voice-btn').textContent = '🎤 语音控制'; setVoiceStatus('已关闭，点击开启语音控制');
    }
  };
  rec.onerror = e => {
    // no-speech / aborted 是正常中断，不停止自动重启
    if(e.error === 'no-speech' || e.error === 'aborted'){ return; }
    voiceRestart = false;
    voiceOn = false;
    $('#voice-btn').classList.remove('active');
    $('#voice-btn').classList.remove('ready');
    $('#voice-btn').textContent = '🎤 语音控制';
    const errMap = {
      'not-allowed': '麦克风权限被拒绝，请在地址栏🔒图标里允许麦克风',
      'service-not-allowed': '语音服务被禁用，请检查浏览器设置',
      'audio-capture': '未检测到麦克风设备，请检查麦克风是否连接',
      'network': '网络错误，语音识别需要联网',
      'language-not-supported': '不支持中文语音识别'
    };
    const msg = errMap[e.error] || ('语音错误：'+e.error);
    setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
    toast(msg, 'err');
  };
  // 彻底清空语音状态（残留文本/中间结果计时/静音计时/显示），回到等待新语音输入
  const clearVoiceState = (alsoHide) => {
    window._lastVoice = ''; window._lastVoiceT = 0;
    window._interimT = ''; window._interimAt = 0;
    window._voiceCurT = '';
    clearTimeout(heardTimer);
    clearTimeout(silenceTimer);
    if(alsoHide){
      const el = $('#voice-status');
      if(el && el.innerHTML.indexOf('听到') === 0) el.innerHTML = '';
    }
  };
  // 执行一句语音指令：不排队、不等待；执行后立即焚毁（清空一切状态），不与下一条粘连
  // fromFinal=true 表示最终确认句（新句放行，可重新点名已点过的人）；false 为静音/中间路径（历史回放不执行）
  const runUtterance = (text, fromFinal) => {
    if(!text) return;
    const clean = stripBurnt(text);
    const shown = clean || text;   // 显示裁剪后的新内容（历史指令不回潮）
    if(!fromFinal && !clean) return;   // 静音路径：整句都是历史 → 忽略
    setVoiceStatus('听到：<span class="cmd">'+esc(shown)+'</span>');
    voiceBtnBusy();
    // 拆成多个动作段依次执行（多条指令粘连成一句时逐条生效）
    const parts = splitVoiceText(fromFinal ? text : shown);
    for(const seg of parts){ if(seg) handleVoiceCommand(seg); }
    // 立即焚毁：清空显示、中间结果、静音计时、去重记录；本句文本加入焚毁列表（供后续回放裁剪）
    clearTimeout(silenceTimer);
    if(clean && window._voiceBurntList[window._voiceBurntList.length-1] !== clean) window._voiceBurntList.push(clean);
    if(window._voiceBurntList[window._voiceBurntList.length-1] !== text) window._voiceBurntList.push(text);
    if(window._voiceBurntList.length > 60) window._voiceBurntList.splice(0, window._voiceBurntList.length - 60);
    window._voiceCurT = '';
    window._interimT = ''; window._interimAt = 0;
    window._lastVoice = ''; window._lastVoiceT = 0;
    const el = $('#voice-status');
    if(el) el.innerHTML = '';   // 无条件清空语音状态区（立即焚毁）
    voiceBtnReady();   // 历史已清空 → 绿色，可输入新指令
  };
  rec.onresult = e => {
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r = e.results[i];
      const t = (r[0].transcript||'').trim();
      if(!t) continue;
      if(r.isFinal){
        // 已确认的一句话：立即执行（最终确认句放行，历史回放被焚毁列表裁剪）
        runUtterance(t, true);
      } else {
        // 中间结果：裁剪掉已焚毁的历史指令后再显示（旧指令不回潮）；静音 0.8 秒视为一句话说完
        const shown = stripBurnt(t);
        if(!shown) continue;   // 全是历史回放 → 不显示不处理（保持绿色待命）
        voiceBtnBusy();
        setVoiceStatus('听到：<span class="cmd">'+esc(shown)+'</span><span style="opacity:.5">…</span>');
        window._voiceCurT = t;
        clearTimeout(silenceTimer);
        silenceTimer = setTimeout(() => {
          const cur = (window._voiceCurT||'').trim();
          if(cur) runUtterance(cur, false);
        }, 800);
      }
    }
  };
  return rec;
}
function matchCmd(text, action){
  const cmds = (S.voiceCommands && S.voiceCommands[action]) || DEFAULT_VOICE_CMDS[action];
  return cmds.some(w => w && text.includes(w.toLowerCase().replace(/\s/g,'')));
}

function sameSound(a,b){
  if(!a || !b) return false;
  if(a === b) return true;
  const pa = PY[a], pb = PY[b];
  if(!pa || !pb) return false;
  const sa = pa.split(','), sb = pb.split(',');
  return sa.some(x => sb.includes(x));
}
function findStudentBySeatNo(no){
  const cc = curClass();
  return cc.students.find(st => st.x>0 && st.y>0 && seatNoOf(st.x,st.y) === no) || null;
}
function parseSeatNoFromText(text){
  const t = (text||'').toLowerCase().replace(/\s/g,'');
  const m = t.match(/(\d{1,2})\s*号?$/);
  if(!m) return 0;
  const no = parseInt(m[1], 10);
  if(no < 11 || no > 99) return 0;
  return findStudentBySeatNo(no) ? no : 0;
}
function findStudentByName(text){
  const cc = curClass();
  const t = (text||'').replace(/\s/g,'');
  if(!t) return null;
  // 1) 精确包含（优先）
  let best = null;
  cc.students.forEach(st => {
    if(st.n && t.includes(st.n)){
      if(!best || st.n.length > best.n.length) best = st;
    }
  });
  if(best) return best;
  // 2) 同音模糊匹配：语音转写常出现同音字（刘卓琳→刘卓林）
  let bestScore = 0;
  cc.students.forEach(st => {
    if(!st.n) return;
    const name = st.n;
    for(let i=0; i+name.length<=t.length; i++){
      const sub = t.substr(i, name.length);
      let score = 0;
      for(let k=0;k<name.length;k++){
        if(sameSound(name[k], sub[k])) score++;
      }
      if(score > bestScore){ bestScore = score; best = st; }
    }
  });
  if(!best) return null;
  const need = best.n.length <= 2 ? best.n.length : best.n.length - 1;
  return bestScore >= need ? best : null;
}

    }
  }
  if(spans.length === 0) return [text.trim()].filter(Boolean);
  spans.sort((a,b) => a.s - b.s || b.e - a.e);
  const merged = [];
  for(const sp of spans){
    if(merged.length && sp.s < merged[merged.length-1].e) continue;
    merged.push(sp);
  }
  const parts = [];
  let pos = 0;
  for(const sp of merged){
    const seg = text.slice(pos, sp.s).trim();
    if(seg) parts.push(seg);
    parts.push(sp.w);
    pos = sp.e;
  }
  const tail = text.slice(pos).trim();
  if(tail) parts.push(tail);
  return parts;
}
function handleVoiceCommand(text){
  const t = text.toLowerCase().replace(/\s/g,'');
  const hasPop = !!$('#avatar-pop-mask');
  // 弹窗打开时：点赞 / 加油 / 关闭 / 新座位号点名 / 重新点名
  if(hasPop){
    if(matchCmd(t,'like')){ $('#av-like')?.click(); return true; }
    if(matchCmd(t,'cheer')){ $('#av-cheer')?.click(); return true; }
    if(matchCmd(t,'close')){ stopAllFx(); closeAvatarPop(); return true; }
    // 新姓名指令：关闭旧弹窗，展示对应学生（同一学生不重复弹）
    const stName2 = findStudentByName(text);
    if(stName2){
      if(window._popSid === stName2.id) return true;
      closeAvatarPop();
      showAvatarPop(stName2);
      setVoiceStatus('点名：<span class="cmd">'+esc(stName2.n)+'</span>');
      return true;
    }
    // 新座位号指令：关闭旧弹窗，展示新学生（同一学生不重复弹）
    if(S.voiceSeat !== false){
      const seatNo2 = parseSeatNoFromText(text);
      if(seatNo2){
        const st2 = findStudentBySeatNo(seatNo2);
        if(st2){
          if(window._popSid === st2.id) return true;
          closeAvatarPop();
          showAvatarPop(st2);
          setVoiceStatus('座位 '+seatNo2+' 号：<span class="cmd">'+esc(st2.n)+'</span>');
          return true;
        }
      }
    }
    // 重新开始点名：关闭旧弹窗进入滚动
    if(matchCmd(t,'start')){ closeAvatarPop(); startRoll(); return true; }
  }
  // 滚动中：停止
  if(rolling){
    if(matchCmd(t,'stop')){ stopRoll(); return true; }
  }
  // 空闲：点名 / 说姓名 / 说座位号直接点名
  if(!rolling && !hasPop){
    if(matchCmd(t,'start')){ startRoll(); return true; }
    if(S.voiceName !== false){
      const stName = findStudentByName(text);
      if(stName){
        showAvatarPop(stName);
        setVoiceStatus('点名：<span class="cmd">'+esc(stName.n)+'</span>');
        return true;
      }
    }
    if(S.voiceSeat !== false){
      const seatNo = parseSeatNoFromText(text);
      if(seatNo){
        const st = findStudentBySeatNo(seatNo);
        if(st){
          showAvatarPop(st);
          setVoiceStatus('座位 '+seatNo+' 号：<span class="cmd">'+esc(st.n)+'</span>');
          return true;
        }
      }
    }
  }
  return false;
}
function toggleVoice(){
  if(!voiceRec){ voiceRec = initVoice(); if(!voiceRec){ toast('当前浏览器不支持语音识别，请用Chrome或Edge','err'); return; } }
  if(voiceOn){
    voiceRestart = false;
    voiceRec.stop();
  } else {
    // 检查安全上下文（HTTPS或localhost）
    if(!window.isSecureContext){
      const msg = '当前页面不是安全环境（需HTTPS或localhost），无法使用麦克风。请用 http://localhost 打开或部署到HTTPS网站';
      setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
      toast(msg, 'err');
      return;
    }
    const startSR = () => {
      voiceRestart = true;
      try{
        voiceRec.start();
        setVoiceStatus('正在启动麦克风…');
      }catch(e){
        voiceRestart = false;
        const msg = '启动失败：'+(e.message||e)+'。请确认已允许麦克风权限';
        setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
        toast(msg, 'err');
      }
    };
    // 预授权：主动申请一次麦克风权限，失败时给出明确指引（避免反复弹权限框）
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      navigator.mediaDevices.getUserMedia({audio:true}).then(() => {
        startSR();
      }).catch(err => {
        voiceRestart = false;
        let hint = '';
        if(location.protocol === 'file:'){
          hint = '。当前是双击文件打开，浏览器记不住权限所以反复弹框：请改用在线链接打开（https://aka.doubaocdn.com/…），或在浏览器地址栏左侧图标中允许麦克风';
        }else{
          hint = '。请在浏览器地址栏的🔒/图标中允许麦克风权限后重试';
        }
        const msg = '麦克风未授权'+hint;
        setVoiceStatus('<span style="color:#fca5a5">'+esc(msg)+'</span>');
        toast(msg, 'err');
      });
    }else{
      startSR();
    }
  }
}

function renameClass(oldKey, newKey){
  newKey = (newKey||'').trim();
  if(!newKey || newKey === oldKey) return;
  if(S.classes[newKey]){ toast('班级名「'+newKey+'」已存在','err'); return; }
  const cls = S.classes[oldKey];
  if(!cls) return;
  cls.name = newKey;
  const newClasses = {};
  Object.keys(S.classes).forEach(k => {
    newClasses[k === oldKey ? newKey : k] = S.classes[k];
  });
  S.classes = newClasses;
  if(S.cur === oldKey) S.cur = newKey;
  toast('班级已改名','ok');
}

const ADMIN_LS = 'rollcall-admin';
const TRIAL_LS = 'rollcall-trial';
const VIP_SECRET = ['V5x','Kp9q','Wm2','-t7'].join('');
function vipHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h+str.charCodeAt(i))|0; }
  return (h>>>0).toString(36);
}
function genVipCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let payload='';
  for(let i=0;i<10;i++) payload += chars[Math.floor(Math.random()*chars.length)];
  const code = payload + vipHash(payload + VIP_SECRET).slice(0,3).toUpperCase();
  return code.slice(0,5)+'-'+code.slice(5,13);
}
function verifyVipCode(raw){
  const code = (raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length !== 13) return false;
  return vipHash(code.slice(0,10) + VIP_SECRET).slice(0,3).toUpperCase() === code.slice(10);
}
function deviceFp(){
  let s = navigator.userAgent + '|' + screen.width + 'x' + screen.height + '|' + (screen.colorDepth||24) + '|' + ((Intl.DateTimeFormat().resolvedOptions().timeZone)||'') + '|' + (navigator.language||'');
  try{
    const c = document.createElement('canvas'); c.width=120; c.height=40;
    const ctx = c.getContext('2d');
    if(ctx){ ctx.font='18px Arial'; ctx.fillStyle='#123'; ctx.fillText('vip-fp-'+Math.PI, 5, 25); s += '|' + c.toDataURL().slice(-40); }
  }catch(e){}
  return vipHash(s).slice(0,10);
}
function isAdminMode(){ return localStorage.getItem(ADMIN_LS) === '1'; }
function isVip(){
  if(isAdminMode()) return true;
  try{
    const st = JSON.parse(localStorage.getItem(VIP_LS) || 'null');
    if(!st || !st.code) return false;
    // 一次激活永久使用：不校验设备指纹，避免换浏览器/窗口变化导致重复激活
    return verifyVipCode(st.code);
  }catch(e){ return false; }
}
function activateVip(raw){
  const code = (raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length !== 13 || !verifyVipCode(code)) return {ok:false, msg:'口令无效，请检查后重试'};
  localStorage.setItem(VIP_LS, JSON.stringify({code, at: Date.now()}));
  return {ok:true, msg:'VIP已激活，一次激活永久使用'};
}
function updateVipUI(){
  const vip = isVip();
  const trial = !vip && isTrialValid();
  const b = $('#btn-vip'), badge = $('#trial-badge');
  if(b) b.textContent = vip ? '👑 永久VIP' : (trial ? '👑 试用中' : '👑 激活 VIP');
  if(badge){
    if(vip){ badge.style.display = 'none'; }
    else if(trial){ badge.style.display = 'inline-block'; badge.textContent = '试用剩 ' + trialDaysLeft() + ' 天'; }
    else badge.style.display = 'none';
  }
  if(!vip && $('#stage').classList.contains('vip-locked')) $('#stage').classList.remove('vip-locked');
}

function openVipPanel(){
  if(isAdminMode()){ showVipGenModal(); return; }
  showVipModal();
}
function showVipGenModal(){
  if($('#vipgen-modal')) return;
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'vipgen-modal';
  mask.innerHTML = `
    <div class="modal" style="max-width:460px">
      <div class="modal-head">👑 生成双码<span class="close-x">✕</span></div>
      <div class="modal-body">
        <div style="font-size:12.5px;color:#475569;line-height:1.8">点击生成一组：一个<b>登录密码</b> + 一个<b>VIP口令</b>，直接显示可复制。发给用户后：输入密码登录 → 输入口令激活，一次激活永久使用（15元/每账户）。</div>
        <div style="display:flex;gap:8px;margin:12px 0">
          <button class="btn btn-brand" id="vipgen-btn" style="flex:1">生成一组双码</button>
          <button class="btn btn-ghost" id="vipgen-copy" style="flex:1">复制双码</button>
        </div>
        <textarea id="vipgen-codes" class="inp" style="width:100%;height:96px;font-family:monospace;font-size:13px;line-height:2" readonly placeholder="点击「生成一组双码」"></textarea>
      </div>
    </div>`;
  document.body.appendChild(mask);
  mask.querySelector('.close-x').onclick = () => mask.remove();
  mask.onclick = e => { if(e.target === mask) mask.remove(); };
  mask.querySelector('#vipgen-btn').onclick = () => {
    const pw = PASSWORDS[Math.floor(Math.random() * PASSWORDS.length)];
    const code = genVipCode();
    mask.querySelector('#vipgen-codes').value = `【登录密码】${pw}\n【VIP口令】${code}`;
    toast('已生成一组（登录密码 + VIP口令）','ok');
  };
  mask.querySelector('#vipgen-copy').onclick = () => {
    const v = mask.querySelector('#vipgen-codes').value;
    if(!v) return toast('请先生成双码','err');
    const done = () => toast('已复制双码','ok');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done).catch(() => fallbackCopy(v, done));
    else fallbackCopy(v, done);
  };
}
function showVipModal(desc){
  if($('#vip-modal')) return;
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.id = 'vip-modal';
  const vip = isVip();
  const logged = !!(localStorage.getItem(LOGIN_LS) || localStorage.getItem(TRIAL_LS) || localStorage.getItem(ADMIN_LS));
  let inner;
  if(vip){
    inner = `
      <div style="text-align:center;padding:10px 0 4px">
        <div style="font-size:26px">👑</div>
        <div style="font-size:18px;font-weight:900;color:#16a34a;margin:8px 0 4px">您已永久VIP</div>
        <div style="font-size:13px;color:#64748b;margin-bottom:14px">${logged ? '您已登录 ✔' : '当前未登录'}</div>
        ${logged ? '' : `
        <input class="inp" id="vip-login-pass" maxlength="6" inputmode="numeric" placeholder="6位登录密码" style="width:100%;text-align:center;font-size:20px;letter-spacing:8px;padding:10px;margin-bottom:8px" autocomplete="off">
        <button class="btn btn-brand" id="vip-login-btn" style="width:100%">登 录</button>
        <div id="vip-msg" style="font-size:12px;color:#dc2626;margin-top:6px;min-height:16px"></div>`}
        <button class="btn btn-danger" id="vip-logout-btn" style="width:100%;margin-top:12px">🚪 退出登录</button>
      </div>`;
  } else {
    inner = `
      <div style="text-align:center;font-size:15px;font-weight:700;color:#1e293b;margin-bottom:8px">${desc?esc(desc)+'需要解锁VIP功能':'解锁VIP功能'}</div>
      <div style="text-align:center;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1px solid #fdba74;border-radius:10px;padding:10px;margin-bottom:10px">
        <div style="font-size:12.5px;color:#9a3412;font-weight:700">🎉 本月限时优惠</div>
        <div style="font-size:22px;font-weight:900;color:#ea580c;margin:2px 0"><span style="font-size:13px">仅需</span> 15 元 <span style="font-size:12px;color:#9a3412">一费全包 · 永久使用</span></div>
        <div style="font-size:11px;color:#b45309">不定时调价，早开通早优惠</div>
      </div>
      <div class="vip-qrs">
        <div class="vip-qr"><img id="vip-qr-pay" alt="付款码"><span class="qr-cap">付款码</span></div>
        <div class="vip-qr"><img id="vip-qr-wechat" alt="微信客服码"><span class="qr-cap">微信客服</span></div>
      </div>
      <div style="font-size:12px;color:#475569;line-height:1.7;text-align:center;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:7px 10px;margin:8px 0">
        扫码付款 → 加客服微信 → 发送付款截图获取 <b>密码 + 激活码</b>
      </div>
      <div style="font-size:12.5px;font-weight:700;color:#334155;margin:4px 0 6px">输入密码 + 激活码，一步登录并激活：</div>
      <input class="inp" id="vip-pass-input" maxlength="6" inputmode="numeric" placeholder="6位登录密码" style="width:100%;text-align:center;font-size:18px;letter-spacing:6px;padding:9px;margin-bottom:8px" autocomplete="off">
      <div style="display:flex;gap:8px">
        <input class="inp" id="vip-code-input" style="flex:1" placeholder="VIP激活码" maxlength="14" autocomplete="off">
        <button class="btn btn-brand" id="vip-activate" style="white-space:nowrap">登录并激活</button>
      </div>
      <div id="vip-msg" style="font-size:12px;color:#dc2626;margin-top:6px;min-height:16px"></div>
      <div style="font-size:11px;color:#64748b;line-height:1.6;background:#f8fafc;border-radius:6px;padding:6px 8px;margin-top:6px">一次激活永久使用。游客可免费试用 3 天全功能，到期后需开通 VIP。已有密码未激活？输入密码+激活码一步完成。</div>`;
  }
  mask.innerHTML = `<div class="modal" style="max-width:440px">
    <div class="modal-head">👑 激活 VIP<span class="close-x">✕</span></div>
    <div class="modal-body">${inner}</div>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('.close-x').onclick = () => mask.remove();
  mask.onclick = e => { if(e.target === mask) mask.remove(); };
  const qp = mask.querySelector('#vip-qr-pay'); if(qp) qp.src = QR_PAY;
  const qw = mask.querySelector('#vip-qr-wechat'); if(qw) qw.src = QR_WECHAT;
  if(vip){
    const lo = mask.querySelector('#vip-logout-btn');
    lo.onclick = () => { doLogout(); mask.remove(); };
    const lp = mask.querySelector('#vip-login-btn');
    if(lp) lp.onclick = () => doLoginInModal(mask);
  } else {
    const act = mask.querySelector('#vip-activate');
    act.onclick = () => vipLoginAndActivate(mask);
    const ci = mask.querySelector('#vip-code-input');
    ci.addEventListener('keydown', e => { if(e.key === 'Enter') act.click(); });
    setTimeout(() => mask.querySelector('#vip-pass-input').focus(), 50);
  }

function vipLoginAndActivate(mask){

function isTrialValid(){
  if(localStorage.getItem(TRIAL_LS) !== '1') return false;
  const start = parseInt(localStorage.getItem('rollcall-trial-start')||'0',10)||0;
  if(!start){ localStorage.removeItem(TRIAL_LS); return false; }
  if(Date.now() - start < 3*24*3600*1000) return true;
  localStorage.removeItem(TRIAL_LS);
  localStorage.removeItem('rollcall-trial-start');
  return false;
}
function trialDaysLeft(){
  const start = parseInt(localStorage.getItem('rollcall-trial-start')||'0',10)||0;
  const left = 3 - Math.ceil((Date.now()-start)/(24*3600*1000));
  return Math.max(1, Math.min(3, left));
}

function showPassbook(){
  const mask = document.createElement('div');

  document.body.appendChild(mask);

    const extras = getExtraPasses();
    let html = `<div class="passbook-row"><b>${ADMIN_PASS}</b><span>管理员密码</span></div>`;
    PASSWORDS.forEach((p,i) => { html += `<div class="passbook-row"><b>${p}</b><span>密码 ${i+1}</span></div>`; });

      html += `<div class="passbook-row" style="border-color:var(--brand-l);background:var(--brand-l)"><b>${p}</b><span>自定义${i+1} <button data-del="${p}" style="color:var(--danger);font-size:11px;margin-left:6px;font-weight:700">删除</button></span></div>`;
    });
    rows.innerHTML = html;
    rows.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => {
        const p = btn.dataset.del;
        const list = getExtraPasses().filter(x => x !== p);
        localStorage.setItem(EXTRA_LS, JSON.stringify(list));
        toast('已删除密码 '+p,'ok');
        renderRows();

  // 添加自定义密码

    const v = newInput.value.trim();
    if(!/^\d{6}$/.test(v)){ addErr.textContent = '请输入6位数字密码'; return; }

  mask.onclick = e => { if(e.target === mask) mask.remove(); };
}

function bindHelpCopy(root){
  root.querySelectorAll('.lh-copy').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    const url = document.getElementById(btn.dataset.target).textContent.trim();
    const done = () => { btn.textContent = '✓ 已复制'; setTimeout(() => btn.textContent = '复制', 1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
    } else fallbackCopy(url, done);
  });
}
function fallbackCopy(txt, done){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(err){ toast('复制失败，请手动复制','err'); }
  ta.remove();
}
